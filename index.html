<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOODY AUXLIO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.panel{
width:350px;
background:#111;
border:2px solid #3b5cff;
border-radius:25px;
padding:20px;
box-shadow:0 0 25px #244cff;
}

h1{
text-align:center;
color:#4d6fff;
margin-bottom:5px;
}

p{
text-align:center;
color:#aaa;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#1a1a1a;
padding:15px;
border-radius:12px;
margin-bottom:15px;
color:white;
}

.switch{
position:relative;
width:50px;
height:26px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:#555;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

.slider:before{
content:"";
position:absolute;
width:20px;
height:20px;
left:3px;
bottom:3px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked + .slider{
background:#3b5cff;
}

input:checked + .slider:before{
transform:translateX(24px);
}

.footer{
text-align:center;
color:#666;
margin-top:20px;
font-size:13px;
}
</style>

</head>

<body>

<div class="panel">

<h1>VOODY AUXLIO</h1>
<p>Dashboard</p>

<div class="item">
<span>Performance Mode</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>FPS Monitor</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>Dark Theme</span>
<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>Device Info</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="footer">
VOODY AUXLIO © 2026
</div>

</div>

</body>
</html>
